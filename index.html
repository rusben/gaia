hist.forEach((a,s)=>{chc.strokeStyle=SP[s].k;chc.lineWidth=s==hS?2.8:1.2;chc.globalAlpha=hS<0||s==hS?1:.35;chc.beginPath();a.forEach((v,i)=>{const x=i/(HL-1)*W,y=H-2-v/mx*(H-4);i?chc.lineTo(x,y):chc.moveTo(x,y)});chc.stroke()});chc.globalAlpha=1;
if(hov>=0){chc.strokeStyle='rgba(255,255,255,.35)';chc.lineWidth=1;const x=hov/(HL-1)*W;chc.beginPath();chc.moveTo(x,0);chc.lineTo(x,H);chc.stroke()}}
const chEl=$('ch'),tip=$('tip');
function chHover(e){const r=chEl.getBoundingClientRect(),n=hist[0].length;if(!n)return;const x=(e.clientX-r.left)/r.width*226,y=(e.clientY-r.top)/r.height*72;hov=cl01(Math.round(x/226*(HL-1)),0,n-1);
let bd=1e9;hS=0;hist.forEach((a,s)=>{const d=Math.abs(70-a[hov]/chMax*68-y);if(d<bd){bd=d;hS=s}});
const day=Math.max(1,Math.floor(simD-(n-1-hov)*.5)+1);
tip.innerHTML='<b>Día '+day+'</b>'+SP.map((S,s)=>`<div style="${s==hS?'font-weight:700;color:#fff':'opacity:.75'}"><span style="color:${S.k}">●</span> ${S.e} ${S.n}: ${hist[s][hov]}</div>`).join('');
tip.style.display='block';tip.style.left=Math.min(innerWidth-170,e.clientX+14)+'px';tip.style.top=Math.max(8,e.clientY-60)+'px';chart()}
chEl.onpointermove=chEl.onpointerdown=chHover;chEl.onpointerleave=()=>{hov=hS=-1;tip.style.display='none';chart()};
// ---------- arranque ----------
xform();for(let i=0;i<150;i++)tick(.2);simD=0;
SP.forEach((S,s)=>{let n=0,g=0;while(n<S.q&&g++<4000){const c=R()*NC|0;if(okc(s,c)&&(S.d!='land'||(p[c]>.1||R()<.2))){mk(s,c,null,.8+R()*.4);n++}}});
for(let c=0;c<NC;c++)paint(c);geo.attributes.color.needsUpdate=true;updTrees();updRivers();updPuffs();updAgents();
setTool('rain');setSpeedFromSlider();$('load').remove();
let last=performance.now(),vt=0,fr=0;
function frame(now){requestAnimationFrame(frame);const rd=Math.min((now-last)/1000,.1);last=now;fr++;
const sd=paused?0:rd*speed/DAYSEC;
if(sd>0){simD+=sd;xform();const n=Math.min(6,Math.ceil(sd/.04));for(let i=0;i<n;i++)tick(sd/n)}
else xform();
vt+=rd;if(vt>.3){vt=0;for(let c=0;c<NC;c++)paint(c);geo.attributes.color.needsUpdate=true;updTrees();updRivers();updPuffs();hud()}
updAgents();updRain(paused?0:rd);
for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.t-=rd;b.l.material.opacity=Math.max(0,b.t/.3);if(b.t<=0){spin.remove(b.l);b.l.geometry.dispose();bolts.splice(i,1)}}
flT=Math.max(0,flT-rd);flash.intensity=flT*30;
dist+=(tdist-dist)*Math.min(1,rd*6);const tp=planet.position;
cam.position.set(tp.x+dist*Math.cos(el)*Math.cos(az),tp.y+dist*Math.sin(el),tp.z+dist*Math.cos(el)*Math.sin(az));cam.lookAt(tp);cam.updateMatrixWorld();
atm.material.uniforms.sd.value.copy(tp).negate().normalize().transformDirection(cam.matrixWorldInverse);
ren.render(scene,cam)}
requestAnimationFrame(frame);
}
